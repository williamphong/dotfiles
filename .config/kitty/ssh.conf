# Files kitty copies to a remote host when connecting with `kitten ssh`.
#
# --symlink-strategy=keep-path is required, not optional. These paths are
# symlinks into the dotfiles repo (see install.sh), and the default strategy,
# "preserve", re-creates the symlink itself on the remote -- pointing at a
# ~/Github/dotfiles that does not exist there, so every copied config would
# land broken. "keep-path" follows the link and copies what it points at while
# still writing it to the symlink's own path (~/.config/nvim, not the target's
# path inside the repo).
#
# --exclude=**/.git stops the tmux plugin checkouts from dragging their git
# history along on every connection.
#
# Kept to one line on purpose: kitty's continuation syntax puts the backslash
# at the START of the continued line, the opposite of shell, so a shell-style
# trailing backslash here silently misparses.
#
# Note this overwrites ~/.bashrc on the remote. Per-server customization
# belongs in ~/.bash_aliases there, which .bashrc sources and which is never
# copied.
copy --symlink-strategy=keep-path --exclude=**/.git .bashrc .config/nvim .config/lsd .config/tmux .config/fastfetch
