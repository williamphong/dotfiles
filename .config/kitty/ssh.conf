# Files kitty copies to a remote host when connecting with `kitten ssh`.
#
# The bootstrap re-extracts these on EVERY connection, so anything copied here
# is overwritten each time you connect. That is what you want for config that
# should track the repo, and what you do not want for the remote's own files.
#
# --symlink-strategy is required, not optional. These paths are symlinks into
# the dotfiles repo (see install.sh), and the default, "preserve", re-creates
# the symlink on the remote -- pointing at a ~/Github/dotfiles that does not
# exist there, so every copied config would land broken. "keep-path" follows
# the link and copies what it points at while still writing it to the
# symlink's own path (~/.config/nvim, not the target's path inside the repo).
#
# --exclude=**/.git stops the tmux plugin checkouts from dragging their git
# history along on every connection.
#
# Kept to one line per directive on purpose: kitty's continuation syntax puts
# the backslash at the START of the continued line, the opposite of shell, so
# a shell-style trailing backslash here silently misparses.
copy --symlink-strategy=keep-path --exclude=**/.git .config/nvim .config/lsd .config/tmux .config/fastfetch .config/starship.toml

# .bashrc is handled differently, so that connecting never clobbers the
# remote's own ~/.bashrc -- which matters on a shared account, and means local
# changes there survive.
#
# bash has no ZDOTDIR, but kitty's bash shell integration reads
# KITTY_BASH_RCFILE and sources that instead of ~/.bashrc (it still sources
# the system /etc/bash.bashrc first, so distro setup is not lost). So the repo
# copy lands on a path of its own and the remote's ~/.bashrc is left untouched.
#
# Consequence worth remembering: ~/.config/dotfiles/bashrc is refreshed on
# every connect, so do not hand-edit it on the server. Per-server changes go in
# ~/.bash_aliases, which .bashrc sources and which is never copied.
copy --symlink-strategy=resolve --dest=.config/dotfiles/bashrc .bashrc

# The provisioning script travels too, landing on PATH (.bashrc prepends
# ~/.local/bin). Config arrives on every host but the tools it configures do
# not, so this is what you reach for when you land on a server showing the
# fallback prompt -- fixed in place, without going back to the laptop.
#
# Copied, never run. Nothing executes on connect; see the note at the top of
# the script. Run it as `dotfiles-bootstrap`, or `sh ~/.local/bin/dotfiles-bootstrap`
# if the executable bit did not survive the transfer.
#
# Source is the symlink install.sh creates at ~/.local/bin/dotfiles-bootstrap,
# not bootstrap.sh in the repo: kitty resolves copy paths relative to $HOME, so
# a repo path it cannot see fails to parse the whole directive.
copy --symlink-strategy=keep-path .local/bin/dotfiles-bootstrap
env KITTY_BASH_RCFILE=$HOME/.config/dotfiles/bashrc
